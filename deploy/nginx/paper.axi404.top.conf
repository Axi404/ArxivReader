# paper.axi404.top：网页是 web/ 构建出来的静态文件，nginx 直接发；/api 转给 arxiv-web（FastAPI，127.0.0.1:7298）。
# 服务器上的位置：/etc/nginx/sites-available/paper.axi404.top（sites-enabled 里是指向它的链接）。
# 证书那几行是 certbot 加的。

server {
    server_name paper.axi404.top;
    root /var/www/paper.axi404.top;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript image/svg+xml;

    # 文件名里带哈希，内容变了名字就变，可以一直缓存
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /fonts/ {
        types { font/woff2 woff2; }  # 服务器上这个版本的 nginx 不认 woff2
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # 每一天都是同一个页面，日期由页面从地址里读（正则里有花括号，要加引号）
    location ~ "^/daily/\d{4}-\d{2}-\d{2}/?$" {
        add_header Cache-Control "no-cache";
        try_files /daily/index.html =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:7298;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # FastAPI 自带的接口文档
    location ~ ^/(docs|redoc|openapi\.json)$ {
        proxy_pass http://127.0.0.1:7298;
        proxy_set_header Host $host;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/paper.axi404.top/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/paper.axi404.top/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = paper.axi404.top) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name paper.axi404.top;
    return 404; # managed by Certbot
}
