{% from "_icons.html" import ic %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}arXiv Reader{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2309090b'/%3E%3Cpath d='M9 23 16 9l7 14M11.5 18h9' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preload" href="/static/fonts/centurygothic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/web.css?v={{ asset_version }}">
  <script>
    (function () {
      try {
        var p = JSON.parse(localStorage.getItem("arxiv_reader_prefs_v2") || "{}");
        var d = document.documentElement;
        d.setAttribute("data-mode", p.mode || "auto");
        d.setAttribute("data-abs", p.abs || "both");
        d.setAttribute("data-scope", p.scope || "primary");
      } catch (e) {}
    })();
  </script>
</head>
<body class="{% block body_class %}{% endblock %}">
  <header class="top">
    <div class="container"><div class="bar">
      <a class="brand" href="/">arXiv Reader</a>
      <span class="grow"></span>
      {% block search %}{% endblock %}
      <button type="button" class="ibtn" id="setBtn" aria-label="设置" title="设置">{{ ic("sliders") }}</button>
      <button type="button" class="ibtn" id="cartBtn" aria-label="收藏" title="收藏">{{ ic("star") }}<span class="badge" id="cartBadge" hidden></span></button>
    </div></div>
  </header>

  <main><div class="container">
  {% block content %}{% endblock %}
  <footer class="foot"><span>© 2026 阿汐</span></footer>
  </div></main>

  <div class="pop" id="setPop" role="dialog" aria-label="设置">
    {% block settings %}{% endblock %}
    <div class="field"><span>主题</span>
      <div class="seg" data-pref="mode"><button type="button" data-v="auto">自动</button><button type="button" data-v="light">浅色</button><button type="button" data-v="dark">深色</button></div>
    </div>
  </div>

  <div class="drawer-mask" id="cartMask"></div>
  <aside class="drawer" id="cartDrawer" aria-label="收藏">
    <div class="drawer-head"><h2>收藏</h2><span class="n" id="cartCount">0</span>
      <button type="button" class="ibtn" id="cartClose" aria-label="关闭">{{ ic("x") }}</button></div>
    <div class="row">
      <button type="button" class="btn dark" id="cartCopy">复制 ID</button>
      <button type="button" class="btn" id="cartCopyTitles">复制 ID 和标题</button>
      <button type="button" class="btn danger" id="cartClear">清空</button>
    </div>
    <div class="cart" id="cartList"></div>
  </aside>
  <div class="toast" id="toast" role="status"></div>
  <template id="icons"><span data-ic="x">{{ ic("x") }}</span><span data-ic="left">{{ ic("left") }}</span><span data-ic="right">{{ ic("right") }}</span></template>
  <script src="/static/web.js?v={{ asset_version }}" defer></script>
</body>
</html>
